name: Build Telegram iOS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Telegram iOS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize Android Native Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Telegram-iOS-Client.apk
          ls -lh output_apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-Client-APK
          path: output_apk/Telegram-iOS-Client.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/Telegram-iOS-Client.apk
          tag_name: "v1.0-${{ github.run_number }}"
          name: "Telegram iOS Client v1.0 (Build ${{ github.run_number }})"
          body: |
            ### 📱 Telegram iOS Client for Android
            Готовый APK для установки на смартфон Android!

            #### ✨ Особенности интерфейса:
            - 🔵 Фирменная круглая синяя кнопка отправки с белой стрелкой вверх (↑)
            - 💬 Нативные закруглённые баблы сообщений в стиле iOS (18dp)
            - 🌓 Поддержка тёмной и светлой темы iOS
            - 💫 Пружинные анимации отправки и появления сообщений
            - 🏝️ Дизайн под Dynamic Island / iOS статус-бар
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
